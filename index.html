<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book & Stationery POS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Book & Stationery POS</h1>
      </header>

      <section class="card" id="login-section">
        <h2>Login</h2>
        <form id="login-form">
          <label>
            Username
            <input id="username" type="text" required autocomplete="username" />
          </label>
          <label>
            Password
            <input
              id="password"
              type="password"
              required
              minlength="8"
              autocomplete="current-password"
              pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}"
              title="Use at least 8 chars with upper, lower, number, and symbol."
            />
          </label>
          <button type="submit">Sign in</button>
        </form>
      </section>

      <section class="card hidden" id="pos-section">
        <div class="header-row">
          <h2>Sales Desk</h2>
          <button id="logout" type="button">Log out</button>
        </div>

        <form id="customer-form">
          <h3>Create Customer</h3>
          <div class="grid">
            <label>
              Name
              <input id="customer-name" type="text" required />
            </label>
            <label>
              Phone
              <input id="customer-phone" type="tel" required />
            </label>
          </div>
          <button type="submit">Save Customer</button>
        </form>

        <form id="sale-form">
          <h3>New Sale</h3>
          <div class="grid">
            <label>
              Customer
              <select id="sale-customer" required>
                <option value="">Choose customer</option>
              </select>
            </label>
            <label>
              Item Type
              <select id="item-type" required>
                <option value="book">Book</option>
                <option value="stationery">Stationery</option>
              </select>
            </label>
            <label>
              Item Name
              <input id="item-name" type="text" required />
            </label>
            <label>
              Quantity
              <input id="quantity" type="number" min="1" value="1" required />
            </label>
            <label>
              Unit Price
              <input id="price" type="number" min="0" step="0.01" required />
            </label>
            <label>
              Amount Paid
              <input id="amount-paid" type="number" min="0" step="0.01" value="0" required />
            </label>
          </div>

          <div class="grid hidden" id="book-options">
            <label>
              School
              <input id="school" type="text" />
            </label>
            <label>
              Grade
              <select id="grade">
                <option value="">Choose grade</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
              </select>
            </label>
          </div>

          <button type="submit">Record Sale</button>
        </form>

        <section>
          <h3>Customer Balances</h3>
          <ul id="balances"></ul>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
